<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <!-- Three horizontal extract-lines of varying length.
       The top and bottom are lighter; the middle is the primary color.
       Reads like a quote mark, equalizer, or trimmed transcript. -->
  <line x1="10" y1="18" x2="40" y2="18" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" />
  <line x1="10" y1="32" x2="54" y2="32" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" />
  <line x1="10" y1="46" x2="34" y2="46" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" />
</svg>
